[project]
name = "awakelab-solicitudes-v2"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
    "openpyxl>=3.1.5",
    "pypdf>=6.19.0",
    "python-docx>=1.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]